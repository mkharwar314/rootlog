  <script>
    // =========================================================================
    // 1. DEFAULT CONFIG & FALLBACK SAMPLE NOTES
    // =========================================================================
    const STORAGE_KEY = 'gitvault_config_v2';

    const DEFAULT_CONFIG = {
      owner: 'mkharwar314',
      repo: 'rootlog',
      branch: 'main',
      token: ''
    };

    const DEMO_NOTES = [
      {
        path: 'README.md',
        sha: 'demo-readme',
        content: `---
title: rootlog
date: 2026-11-22
tags: [notes, markdown, github]
---

A distraction-free Markdown reader connected to \`mkharwar314/rootlog\`.

> [!NOTE]
> Currently displaying offline sample notes. Click **rootlog** or the settings icon in the top bar to reconnect or update your GitHub repository settings.

## Features

- [x] Rich Markdown rendering with YAML frontmatter and task lists
- [x] Obsidian-style \`[[WikiLinks]]\` and GitHub callout blocks
- [x] Relative image and internal document link resolution
- [x] Keyboard shortcuts (\`/\` or \`Cmd+K\` to search, \`Esc\` to close dialogs)

## Quick Reference

| Shortcut | Action |
| :--- | :--- |
| \`/\` or \`Cmd + K\` | Filter notes in sidebar |
| \`Esc\` | Close modal or outline |
`
      },
      {
        path: 'Guides/Nmap-Enumeration.md',
        sha: 'demo-nmap',
        content: `---
title: Nmap Enumeration
category: Security
tags: [nmap, recon]
---

Systematic port scanning and service discovery workflow.

> [!TIP]
> Save scan output in all formats using \`-oA scan_name\` for easy parsing later.

## Two-Stage Scan

\`\`\`bash
export TARGET=10.10.142.88
nmap -p- --min-rate 5000 -Pn -n $TARGET -oN all_ports.nmap
\`\`\`

Run targeted NSE scripts and version detection on discovered ports:

\`\`\`bash
PORTS=$(grep '^[0-9]' all_ports.nmap | cut -d '/' -f 1 | tr '\\n' ',' | sed 's/,$//')
nmap -sC -sV -p $PORTS -Pn $TARGET -oN detailed.nmap
\`\`\`
`
      }
    ];

    // =========================================================================
    // 2. APPLICATION STATE
    // =========================================================================
    let state = {
      config: { ...DEFAULT_CONFIG },
      isDemoMode: false,
      files: [],
      contentCache: {},
      activePath: null,
      viewMode: 'rendered',
      forceMarkdownTxt: false,
      searchQuery: '',
      sidebarCollapsed: false,
      expandedFolders: new Set()
    };

    if (typeof marked !== 'undefined' && typeof marked.use === 'function') {
      marked.use({ gfm: true, breaks: true });
    }

    // =========================================================================
    // 3. INITIALIZATION & KEYBOARD SHORTCUTS
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      loadConfigFromStorage();
      setupKeyboardShortcuts();
      setupOutsideClickHandlers();
      setupTouchGestures();

      if (state.config.owner && state.config.repo) {
        connectToGitHubRepo(state.config);
      } else {
        activateDemoMode(false);
      }
    });

    function setupTouchGestures() {
      let touchStartX = 0;
      let touchStartY = 0;

      document.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      document.addEventListener('touchend', (e) => {
        if (window.innerWidth >= 1024 || e.changedTouches.length !== 1) return;
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = Math.abs(e.changedTouches[0].clientY - touchStartY);

        // Ignore vertical scrolls or diagonal gestures
        if (deltaY > 50 || Math.abs(deltaX) < 65) return;

        const sidebar = document.getElementById('left-sidebar');
        const isSidebarOpen = !sidebar.classList.contains('-translate-x-full');

        // Swipe right from left edge opens drawer; swipe left closes drawer
        if (!isSidebarOpen && touchStartX <= 36 && deltaX > 65) {
          toggleSidebar(true);
        } else if (isSidebarOpen && deltaX < -65) {
          toggleSidebar(false);
        }
      }, { passive: true });

      window.addEventListener('resize', () => {
        const sidebar = document.getElementById('left-sidebar');
        const backdrop = document.getElementById('mobile-backdrop');
        if (window.innerWidth >= 1024) {
          backdrop.classList.add('hidden');
          sidebar.classList.remove('-translate-x-full');
          sidebar.classList.toggle('hidden', state.sidebarCollapsed);
        } else {
          sidebar.classList.remove('hidden');
        }
      });
    }

    function setupOutsideClickHandlers() {
      document.addEventListener('click', (e) => {
        const popover = document.getElementById('outline-popover');
        const btn = document.getElementById('outline-toggle-btn');
        if (!popover.classList.contains('hidden') && !popover.contains(e.target) && !btn.contains(e.target)) {
          toggleOutlinePopover(false);
        }
      });
    }

    function setupKeyboardShortcuts() {
      document.addEventListener('keydown', (e) => {
        const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
        const isTyping = tag === 'input' || tag === 'textarea' || (e.target && e.target.isContentEditable);

        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          focusSearchInput();
          return;
        }

        if (e.key === '/' && !isTyping) {
          e.preventDefault();
          focusSearchInput();
          return;
        }

        if (e.key === 'Escape') {
          const modal = document.getElementById('setup-modal');
          if (!modal.classList.contains('hidden')) {
            closeSetupModal();
            return;
          }
          const popover = document.getElementById('outline-popover');
          if (!popover.classList.contains('hidden')) {
            toggleOutlinePopover(false);
            return;
          }
          if (window.innerWidth < 1024) {
            toggleSidebar(false);
          }
        }
      });
    }

    function focusSearchInput() {
      if (window.innerWidth < 1024) {
        toggleSidebar(true);
      } else if (state.sidebarCollapsed) {
        toggleSidebar(true);
      }
      const input = document.getElementById('search-input');
      input.focus();
      input.select();
    }

    function loadConfigFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.config = {
            owner: parsed.owner || DEFAULT_CONFIG.owner,
            repo: parsed.repo || DEFAULT_CONFIG.repo,
            branch: parsed.branch || DEFAULT_CONFIG.branch,
            token: parsed.token || ''
          };
        } else {
          state.config = { ...DEFAULT_CONFIG };
        }
      } catch (err) {
        state.config = { ...DEFAULT_CONFIG };
      }
      syncFormWithState();
    }

    function saveConfigToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.config));
      } catch (err) {
        console.warn('Unable to persist config:', err);
      }
    }

    function syncFormWithState() {
      document.getElementById('input-owner').value = state.config.owner || DEFAULT_CONFIG.owner;
      document.getElementById('input-repo').value = state.config.repo || DEFAULT_CONFIG.repo;
      document.getElementById('input-branch').value = state.config.branch || DEFAULT_CONFIG.branch;
      document.getElementById('input-token').value = state.config.token || '';
    }

    // =========================================================================
    // 4. GITHUB REPOSITORY SYNC
    // =========================================================================
    function getGitHubHeaders() {
      const headers = { 'Accept': 'application/vnd.github+json' };
      if (state.config.token && state.config.token.trim().length > 0) {
        headers['Authorization'] = `Bearer ${state.config.token.trim()}`;
      }
      return headers;
    }

    async function fetchRepoTreeResponse(owner, repo, branch) {
      const treeUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/git/trees/${encodeURIComponent(branch)}?recursive=1&_t=${Date.now()}`;
      return fetch(treeUrl, { headers: getGitHubHeaders(), cache: 'no-store' });
    }

    async function connectToGitHubRepo(cfg, preserveActiveNote = false) {
      const owner = cfg.owner.trim();
      const repo = cfg.repo.trim();
      let branch = (cfg.branch || 'main').trim();
      const previousPath = preserveActiveNote ? state.activePath : null;

      if (!owner || !repo) {
        activateDemoMode(false);
        return;
      }

      document.getElementById('header-repo-name').textContent = repo;
      setLoadingState(true);
      hideBanner();

      try {
        let response = await fetchRepoTreeResponse(owner, repo, branch);

        // Automatic fallback from 'main' to 'master'
        if (response.status === 404 && branch === 'main') {
          const fallbackRes = await fetchRepoTreeResponse(owner, repo, 'master');
          if (fallbackRes.ok) {
            response = fallbackRes;
            branch = 'master';
            state.config.branch = 'master';
            saveConfigToStorage();
            syncFormWithState();
          }
        }

        if (!response.ok) {
          if (response.status === 403 || response.status === 429) {
            throw new Error(`GitHub API rate limit reached (${response.status}). Add a Personal Access Token in settings.`);
          } else if (response.status === 404) {
            throw new Error(`Repository "${owner}/${repo}" (${branch}) not found.`);
          } else {
            throw new Error(`GitHub API error (${response.status}).`);
          }
        }

        const data = await response.json();
        const treeItems = Array.isArray(data.tree) ? data.tree : [];

        const noteFiles = treeItems
          .filter(item => item.type === 'blob' && /\.(md|markdown|mdx|txt)$/i.test(item.path))
          .map(item => ({
            path: item.path,
            sha: item.sha,
            url: item.url
          }))
          .sort((a, b) => a.path.localeCompare(b.path));

        if (noteFiles.length === 0) {
          throw new Error(`No Markdown or text notes found in "${owner}/${repo}".`);
        }

        const previousExpanded = new Set(state.expandedFolders);
        state.isDemoMode = false;
        state.files = noteFiles;
        state.contentCache = {};

        // Preserve open folders on sync, or expand top-level directories on initial load
        if (preserveActiveNote && previousExpanded.size > 0) {
          state.expandedFolders = previousExpanded;
        } else {
          state.expandedFolders = new Set();
          noteFiles.forEach(f => {
            const parts = f.path.split('/');
            if (parts.length > 1) {
              state.expandedFolders.add(parts[0]);
            }
          });
        }

        renderFileTree();

        const targetNote =
          (previousPath && noteFiles.find(f => f.path === previousPath)) ||
          noteFiles.find(f => /(^|\/)readme\.md$/i.test(f.path)) ||
          noteFiles[0];
        await selectNote(targetNote.path);
      } catch (error) {
        setLoadingState(false);
        showBanner(`${error.message} Showing sample notes.`);
        activateDemoMode(false, true);
      }
    }

    function activateDemoMode(showNotification = true, keepBanner = false) {
      state.isDemoMode = true;
      state.files = DEMO_NOTES.map(n => ({ path: n.path, sha: n.sha }));
      state.contentCache = {};
      DEMO_NOTES.forEach(n => {
        state.contentCache[n.path] = n.content;
      });
      state.expandedFolders = new Set(['Guides']);

      document.getElementById('header-repo-name').textContent = state.config.repo || 'rootlog';
      if (!keepBanner) hideBanner();

      renderFileTree();
      selectNote('README.md');

      if (showNotification) {
        closeSetupModal();
        showToast('Loaded sample notes');
      }
    }

    async function refreshRepository(silent = false) {
      if (!silent) showToast('Syncing latest notes...');
      await connectToGitHubRepo(state.config, true);
      if (!silent) showToast('Up to date');
    }

    // Automatically re-sync when switching back to this tab after pushing to GitHub
    let lastAutoSync = Date.now();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !state.isDemoMode && Date.now() - lastAutoSync > 15000) {
        lastAutoSync = Date.now();
        refreshRepository(true);
      }
    });

    // =========================================================================
    // 5. NOTE LOADING & RICH MARKDOWN RENDERING
    // =========================================================================
    async function selectNote(filePath) {
      state.activePath = filePath;
      state.forceMarkdownTxt = false;

      if (state.viewMode !== 'rendered') {
        setViewMode('rendered');
      }

      renderFileTree();
      updateFooterNavigation();

      if (window.innerWidth < 1024) {
        toggleSidebar(false);
      }

      const parts = filePath.split('/');
      const fileName = parts[parts.length - 1];
      document.getElementById('breadcrumb-path').textContent = filePath;
      document.getElementById('note-display-title').textContent = fileName.replace(/\.(md|markdown|mdx|txt)$/i, '');

      const ghLink = document.getElementById('open-github-link');
      if (state.isDemoMode) {
        ghLink.href = `https://github.com/${encodeURIComponent(state.config.owner || 'mkharwar314')}/${encodeURIComponent(state.config.repo || 'rootlog')}`;
      } else {
        const encodedPath = filePath.split('/').map(encodeURIComponent).join('/');
        ghLink.href = `https://github.com/${encodeURIComponent(state.config.owner)}/${encodeURIComponent(state.config.repo)}/blob/${encodeURIComponent(state.config.branch || 'main')}/${encodedPath}`;
      }

      if (state.contentCache[filePath] !== undefined) {
        renderNoteContent(filePath, state.contentCache[filePath]);
        return;
      }

      setLoadingState(true);
      try {
        const encodedPath = filePath.split('/').map(encodeURIComponent).join('/');
        const contentUrl = `https://api.github.com/repos/${encodeURIComponent(state.config.owner)}/${encodeURIComponent(state.config.repo)}/contents/${encodedPath}?ref=${encodeURIComponent(state.config.branch || 'main')}&_t=${Date.now()}`;

        const res = await fetch(contentUrl, { headers: getGitHubHeaders(), cache: 'no-store' });
        if (!res.ok) {
          throw new Error(`Unable to load "${filePath}" (${res.status})`);
        }

        const data = await res.json();
        let decodedContent = '';

        if (data.encoding === 'base64' && data.content) {
          decodedContent = decodeBase64UTF8(data.content);
        } else if (data.download_url) {
          const rawRes = await fetch(data.download_url);
          decodedContent = await rawRes.text();
        }

        state.contentCache[filePath] = decodedContent;
        renderNoteContent(filePath, decodedContent);
      } catch (err) {
        setLoadingState(false);
        showBanner(err.message);
      }
    }

    function decodeBase64UTF8(base64Str) {
      const cleaned = base64Str.replace(/\s/g, '');
      const binaryString = atob(cleaned);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return new TextDecoder('utf-8').decode(bytes);
    }

    function toggleForceMarkdownOnTxt() {
      if (!state.activePath || state.contentCache[state.activePath] === undefined) return;
      state.forceMarkdownTxt = !state.forceMarkdownTxt;
      renderNoteContent(state.activePath, state.contentCache[state.activePath]);
    }

    function resolveRepoRelativePath(baseFilePath, relativeUrl) {
      if (!relativeUrl || /^(https?:|data:|mailto:|#)/i.test(relativeUrl)) {
        return relativeUrl;
      }
      const baseParts = baseFilePath.split('/');
      baseParts.pop();
      const relParts = relativeUrl.replace(/^\.\//, '').split('/');

      for (const segment of relParts) {
        if (segment === '..') {
          baseParts.pop();
        } else if (segment !== '.' && segment !== '') {
          baseParts.push(segment);
        }
      }
      return baseParts.join('/');
    }

    function transformGitHubCallouts(container) {
      const labels = {
        NOTE: { cls: 'callout-note', label: 'Note' },
        TIP: { cls: 'callout-tip', label: 'Tip' },
        IMPORTANT: { cls: 'callout-important', label: 'Important' },
        WARNING: { cls: 'callout-warning', label: 'Warning' },
        CAUTION: { cls: 'callout-caution', label: 'Caution' }
      };

      container.querySelectorAll('blockquote').forEach(bq => {
        const firstP = bq.querySelector('p');
        if (!firstP) return;

        const match = firstP.innerHTML.match(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(?:<br\s*\/?>|\n)?/i);
        if (!match) return;

        const type = match[1].toUpperCase();
        const cfg = labels[type] || labels.NOTE;

        firstP.innerHTML = firstP.innerHTML.replace(match[0], '').trim();
        if (!firstP.innerHTML) firstP.remove();

        const wrapper = document.createElement('div');
        wrapper.className = `markdown-callout ${cfg.cls}`;

        const titleEl = document.createElement('div');
        titleEl.className = 'markdown-callout-title';
        titleEl.textContent = cfg.label;

        wrapper.appendChild(titleEl);
        while (bq.firstChild) {
          wrapper.appendChild(bq.firstChild);
        }
        bq.replaceWith(wrapper);
      });
    }

    function enhanceRenderedDOM(container, filePath) {
      transformGitHubCallouts(container);

      container.querySelectorAll('a[data-wikilink]').forEach(wLink => {
        const targetRaw = wLink.getAttribute('data-wikilink');
        wLink.onclick = (e) => {
          e.preventDefault();
          openWikiLinkTarget(targetRaw);
        };
      });

      container.querySelectorAll('table').forEach(table => {
        if (table.parentElement && table.parentElement.classList.contains('markdown-table-wrap')) return;
        const wrap = document.createElement('div');
        wrap.className = 'markdown-table-wrap';
        table.parentNode.insertBefore(wrap, table);
        wrap.appendChild(table);
      });

      container.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src');
        if (src && !/^(https?:|data:)/i.test(src) && !state.isDemoMode && state.config.owner && state.config.repo) {
          const resolved = resolveRepoRelativePath(filePath, src);
          const encodedPath = resolved.split('/').map(encodeURIComponent).join('/');
          img.src = `https://raw.githubusercontent.com/${encodeURIComponent(state.config.owner)}/${encodeURIComponent(state.config.repo)}/${encodeURIComponent(state.config.branch || 'main')}/${encodedPath}`;
        }
      });

      container.querySelectorAll('a:not([data-wikilink])').forEach(link => {
        const href = link.getAttribute('href');
        if (!href || href.startsWith('#')) return;

        if (!/^(https?:|mailto:)/i.test(href)) {
          const resolved = resolveRepoRelativePath(filePath, href);
          const matchedNote = state.files.find(f => f.path.toLowerCase() === resolved.toLowerCase());
          if (matchedNote) {
            link.href = '#';
            link.onclick = (e) => {
              e.preventDefault();
              selectNote(matchedNote.path);
            };
            return;
          } else if (!state.isDemoMode && state.config.owner && state.config.repo) {
            const encodedPath = resolved.split('/').map(encodeURIComponent).join('/');
            link.href = `https://github.com/${encodeURIComponent(state.config.owner)}/${encodeURIComponent(state.config.repo)}/blob/${encodeURIComponent(state.config.branch || 'main')}/${encodedPath}`;
          }
        }

        link.setAttribute('target', '_blank');
        link.setAttribute('rel', 'noopener noreferrer');
      });

      container.querySelectorAll('pre code').forEach((block) => {
        if (typeof hljs !== 'undefined') {
          hljs.highlightElement(block);
        }
      });
      injectCodeCopyButtons(container);
    }

    function parseYamlFrontmatter(rawText) {
      const fmMatch = rawText.match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/);
      if (!fmMatch) {
        return { metadata: null, body: rawText };
      }

      const yamlBlock = fmMatch[1];
      const body = rawText.slice(fmMatch[0].length);
      const metadata = {};
      let currentArrayKey = null;

      yamlBlock.split(/\r?\n/).forEach(line => {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) return;

        if (trimmed.startsWith('- ') && currentArrayKey) {
          const itemVal = trimmed.slice(2).trim().replace(/^['"]|['"]$/g, '');
          if (!Array.isArray(metadata[currentArrayKey])) {
            metadata[currentArrayKey] = [];
          }
          metadata[currentArrayKey].push(itemVal);
          return;
        }

        const kvMatch = line.match(/^([A-Za-z0-9_-]+)\s*:\s*(.*)$/);
        if (kvMatch) {
          const key = kvMatch[1].toLowerCase();
          const val = kvMatch[2].trim();

          if (val === '') {
            currentArrayKey = key;
            metadata[key] = [];
          } else if (val.startsWith('[') && val.endsWith(']')) {
            currentArrayKey = null;
            metadata[key] = val
              .slice(1, -1)
              .split(',')
              .map(s => s.trim().replace(/^['"]|['"]$/g, ''))
              .filter(Boolean);
          } else {
            currentArrayKey = null;
            metadata[key] = val.replace(/^['"]|['"]$/g, '');
          }
        }
      });

      return { metadata, body };
    }

    function renderFrontmatterHeader(filePath, metadata) {
      const parts = filePath.split('/');
      const defaultTitle = parts[parts.length - 1].replace(/\.(md|markdown|mdx|txt)$/i, '');
      const titleEl = document.getElementById('note-display-title');
      const metaLine = document.getElementById('frontmatter-meta-line');

      titleEl.textContent = (metadata && metadata.title) ? metadata.title : defaultTitle;

      if (!metadata || Object.keys(metadata).length === 0) {
        metaLine.classList.add('hidden');
        metaLine.textContent = '';
        return;
      }

      const segments = [];
      if (metadata.date) segments.push(String(metadata.date));
      if (metadata.category) segments.push(String(metadata.category));
      if (metadata.tags) {
        const tagList = Array.isArray(metadata.tags)
          ? metadata.tags
          : String(metadata.tags).split(',').map(t => t.trim()).filter(Boolean);
        if (tagList.length > 0) {
          segments.push(tagList.map(t => `#${t.replace(/^#/, '')}`).join(' '));
        }
      }

      if (segments.length > 0) {
        metaLine.textContent = segments.join('  ·  ');
        metaLine.classList.remove('hidden');
      } else {
        metaLine.classList.add('hidden');
      }
    }

    function preprocessObsidianWikiLinks(markdownBody) {
      const codeTokens = [];
      const protectedText = markdownBody.replace(/(```[\s\S]*?```|`[^`\n]+`)/g, (match) => {
        const token = `@@CODE_TOKEN_${codeTokens.length}@@`;
        codeTokens.push(match);
        return token;
      });

      const converted = protectedText.replace(/\[\[([^\]\n]+)\]\]/g, (_, inner) => {
        const [rawTarget, rawAlias] = inner.split('|');
        const target = (rawTarget || '').trim();
        const label = (rawAlias || target.split('/').pop() || target).trim();
        return `<a href="#wikilink" data-wikilink="${escapeHtml(target)}" class="wikilink-pill">${escapeHtml(label)}</a>`;
      });

      return converted.replace(/@@CODE_TOKEN_(\d+)@@/g, (_, idx) => codeTokens[Number(idx)]);
    }

    function openWikiLinkTarget(targetRaw) {
      const cleaned = targetRaw.split('#')[0].trim().replace(/^\.\//, '');
      const normalized = cleaned.toLowerCase();
      const withMd = normalized.endsWith('.md') ? normalized : `${normalized}.md`;

      const match =
        state.files.find(f => f.path.toLowerCase() === normalized || f.path.toLowerCase() === withMd) ||
        state.files.find(f => {
          const fileName = f.path.split('/').pop().toLowerCase();
          return fileName === normalized || fileName === withMd;
        });

      if (match) {
        selectNote(match.path);
      } else {
        showToast(`Note "${cleaned}" not found`);
      }
    }

    function renderNoteContent(filePath, rawText) {
      setLoadingState(false);
      document.getElementById('raw-output').textContent = rawText;

      const mdContainer = document.getElementById('markdown-output');
      const txtNotice = document.getElementById('txt-render-notice');
      const forceMdBtn = document.getElementById('btn-force-md');
      const isPlainTxt = /\.txt$/i.test(filePath);

      if (isPlainTxt) {
        txtNotice.classList.remove('hidden');
        forceMdBtn.textContent = state.forceMarkdownTxt ? 'View plain text' : 'Render as Markdown';
      } else {
        txtNotice.classList.add('hidden');
      }

      if (isPlainTxt && !state.forceMarkdownTxt) {
        renderFrontmatterHeader(filePath, null);
        mdContainer.innerHTML = `<pre><code class="language-plaintext">${escapeHtml(rawText)}</code></pre>`;
        injectCodeCopyButtons(mdContainer);
      } else {
        const { metadata, body } = parseYamlFrontmatter(rawText);
        renderFrontmatterHeader(filePath, metadata);
        const processedBody = preprocessObsidianWikiLinks(body);

        let parsedHtml = '';
        if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
          parsedHtml = marked.parse(processedBody);
        } else if (typeof marked === 'function') {
          parsedHtml = marked(processedBody);
        } else {
          parsedHtml = `<p>${escapeHtml(processedBody)}</p>`;
        }

        if (typeof DOMPurify !== 'undefined') {
          parsedHtml = DOMPurify.sanitize(parsedHtml, {
            ADD_TAGS: ['kbd', 'details', 'summary', 'input'],
            ADD_ATTR: ['type', 'checked', 'disabled', 'open', 'target', 'rel', 'data-wikilink', 'class']
          });
        }

        mdContainer.innerHTML = parsedHtml;
        enhanceRenderedDOM(mdContainer, filePath);
      }

      generateTableOfContents(mdContainer);
      const scrollEl = document.getElementById('reader-scroll-container');
      scrollEl.scrollTop = 0;
      updateReadingProgress();
    }

    function injectCodeCopyButtons(container) {
      container.querySelectorAll('pre').forEach((pre) => {
        const codeEl = pre.querySelector('code');
        if (!codeEl) return;

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'absolute top-2 right-2 px-2 py-0.5 rounded bg-surface/90 border border-hairline hover:border-hairlineHover text-[11px] font-mono text-prose hover:text-accent transition';
        copyBtn.textContent = 'Copy';
        copyBtn.onclick = () => {
          copyTextToClipboard(codeEl.innerText);
          copyBtn.textContent = 'Copied';
          copyBtn.classList.add('text-teal');
          setTimeout(() => {
            copyBtn.textContent = 'Copy';
            copyBtn.classList.remove('text-teal');
          }, 1500);
        };

        pre.appendChild(copyBtn);
      });
    }

    // =========================================================================
    // 6. QUIET DIRECTORY TREE & SEARCH FILTER
    // =========================================================================
    function handleSearchInput(val) {
      state.searchQuery = val.trim().toLowerCase();
      const clearBtn = document.getElementById('clear-search-btn');
      clearBtn.classList.toggle('hidden', state.searchQuery.length === 0);
      renderFileTree();
    }

    function clearSearch() {
      const input = document.getElementById('search-input');
      input.value = '';
      handleSearchInput('');
    }

    function getFilteredFiles() {
      if (!state.searchQuery) return state.files;
      return state.files.filter(file => {
        const pathMatch = file.path.toLowerCase().includes(state.searchQuery);
        const cachedText = state.contentCache[file.path];
        const contentMatch = cachedText ? cachedText.toLowerCase().includes(state.searchQuery) : false;
        return pathMatch || contentMatch;
      });
    }

    function buildTreeStructure(files) {
      const root = { name: '', path: '', folders: {}, files: [] };

      files.forEach(file => {
        const parts = file.path.split('/');
        let current = root;

        for (let i = 0; i < parts.length - 1; i++) {
          const folderName = parts[i];
          const folderPath = parts.slice(0, i + 1).join('/');
          if (!current.folders[folderName]) {
            current.folders[folderName] = {
              name: folderName,
              path: folderPath,
              folders: {},
              files: []
            };
          }
          current = current.folders[folderName];
        }

        current.files.push({
          name: parts[parts.length - 1],
          path: file.path
        });
      });

      return root;
    }

    function renderFileTree() {
      const container = document.getElementById('file-tree-container');
      const filteredFiles = getFilteredFiles();

      if (filteredFiles.length === 0) {
        container.innerHTML = `<p class="px-3 py-6 text-center text-xs text-muted">No matching notes</p>`;
        return;
      }

      const tree = buildTreeStructure(filteredFiles);
      const isSearching = state.searchQuery.length > 0;
      container.innerHTML = renderTreeNode(tree, 0, isSearching);
    }

    function renderTreeNode(node, depth, forceExpand) {
      let html = '';

      const folderKeys = Object.keys(node.folders).sort((a, b) => a.localeCompare(b));
      for (const key of folderKeys) {
        const folder = node.folders[key];
        const isExpanded = forceExpand || state.expandedFolders.has(folder.path);
        const paddingLeft = depth * 12 + 8;

        html += `
          <div>
            <button
              onclick="toggleFolder('${escapeHtml(folder.path)}')"
              style="padding-left: ${paddingLeft}px"
              class="w-full flex items-center gap-1.5 py-2 lg:py-1 pr-2 rounded text-muted hover:text-ink hover:bg-elevated/70 active:bg-elevated transition text-left"
            >
              <svg class="w-3 h-3 shrink-0 transition-transform duration-150 ${isExpanded ? 'rotate-90' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
              </svg>
              <span class="truncate font-medium">${escapeHtml(folder.name)}</span>
            </button>
            ${isExpanded ? `<div class="border-l border-hairline/70 ml-3">${renderTreeNode(folder, depth + 1, forceExpand)}</div>` : ''}
          </div>
        `;
      }

      const sortedFiles = [...node.files].sort((a, b) => a.name.localeCompare(b.name));
      for (const file of sortedFiles) {
        const isActive = state.activePath === file.path;
        const paddingLeft = depth * 12 + 12;
        const displayName = file.name.replace(/\.(md|markdown|mdx)$/i, '');

        html += `
          <button
            onclick="selectNote('${escapeHtml(file.path)}')"
            style="padding-left: ${paddingLeft}px"
            class="relative w-full flex items-center gap-2 py-2 lg:py-1 pr-2 rounded transition text-left ${
              isActive
                ? 'bg-elevated text-accent font-medium'
                : 'text-prose hover:text-ink hover:bg-elevated/60 active:bg-elevated'
            }"
          >
            ${isActive ? '<span class="absolute left-0 top-1.5 bottom-1.5 w-[2px] rounded-full bg-teal"></span>' : ''}
            <svg class="w-3.5 h-3.5 shrink-0 ${isActive ? 'text-teal' : 'opacity-60'}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span class="truncate">${escapeHtml(displayName)}</span>
          </button>
        `;
      }

      return html;
    }

    function toggleFolder(folderPath) {
      if (state.expandedFolders.has(folderPath)) {
        state.expandedFolders.delete(folderPath);
      } else {
        state.expandedFolders.add(folderPath);
      }
      renderFileTree();
    }

    // =========================================================================
    // 7. OUTLINE POPOVER, VIEW MODES & FOOTER NAVIGATION
    // =========================================================================
    function generateTableOfContents(container) {
      const tocEl = document.getElementById('toc-container');
      const headings = container.querySelectorAll('h1, h2, h3');

      if (headings.length === 0) {
        tocEl.innerHTML = `<p class="text-muted px-2 py-1">No headings</p>`;
        return;
      }

      const items = [];
      headings.forEach((h, idx) => {
        const id = `heading-${idx}`;
        h.id = id;
        const level = parseInt(h.tagName.substring(1), 10);
        const indent = level === 1 ? 'pl-2 text-ink font-medium' : level === 2 ? 'pl-4 text-muted' : 'pl-6 text-muted/80';

        items.push(`
          <a
            href="#${id}"
            onclick="scrollToHeading(event, '${id}')"
            class="block py-1 pr-2 rounded hover:bg-surface hover:text-accent truncate transition ${indent}"
          >
            ${escapeHtml(h.textContent)}
          </a>
        `);
      });

      tocEl.innerHTML = items.join('');
    }

    function scrollToHeading(e, id) {
      e.preventDefault();
      const target = document.getElementById(id);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        toggleOutlinePopover(false);
      }
    }

    function toggleOutlinePopover(forceState) {
      const popover = document.getElementById('outline-popover');
      const isHidden = popover.classList.contains('hidden');
      const nextShow = typeof forceState === 'boolean' ? forceState : isHidden;
      popover.classList.toggle('hidden', !nextShow);
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      const btnRendered = document.getElementById('btn-mode-rendered');
      const btnRaw = document.getElementById('btn-mode-raw');
      const mdOut = document.getElementById('markdown-output');
      const rawOut = document.getElementById('raw-output-container');

      if (mode === 'rendered') {
        btnRendered.className = 'px-3 py-1.5 sm:px-2.5 sm:py-1 rounded-[4px] font-medium bg-surface text-accent transition';
        btnRaw.className = 'px-3 py-1.5 sm:px-2.5 sm:py-1 rounded-[4px] font-medium text-muted hover:text-ink transition';
        mdOut.classList.remove('hidden');
        rawOut.classList.add('hidden');
      } else {
        btnRaw.className = 'px-3 py-1.5 sm:px-2.5 sm:py-1 rounded-[4px] font-medium bg-surface text-accent transition';
        btnRendered.className = 'px-3 py-1.5 sm:px-2.5 sm:py-1 rounded-[4px] font-medium text-muted hover:text-ink transition';
        rawOut.classList.remove('hidden');
        mdOut.classList.add('hidden');
      }
    }

    function updateReadingProgress() {
      const container = document.getElementById('reader-scroll-container');
      const bar = document.getElementById('reading-progress-bar');
      if (!container || !bar) return;

      const scrollable = container.scrollHeight - container.clientHeight;
      if (scrollable <= 0) {
        bar.style.width = '0%';
        return;
      }
      const pct = Math.min(100, Math.max(0, (container.scrollTop / scrollable) * 100));
      bar.style.width = `${pct}%`;
    }

    function updateFooterNavigation() {
      const idx = state.files.findIndex(f => f.path === state.activePath);
      const prevBtn = document.getElementById('prev-note-btn');
      const nextBtn = document.getElementById('next-note-btn');

      if (idx > 0) {
        const prevTitle = state.files[idx - 1].path.split('/').pop().replace(/\.(md|markdown|mdx|txt)$/i, '');
        prevBtn.textContent = `← ${prevTitle}`;
        prevBtn.disabled = false;
      } else {
        prevBtn.disabled = true;
      }

      if (idx >= 0 && idx < state.files.length - 1) {
        const nextTitle = state.files[idx + 1].path.split('/').pop().replace(/\.(md|markdown|mdx|txt)$/i, '');
        nextBtn.textContent = `${nextTitle} →`;
        nextBtn.disabled = false;
      } else {
        nextBtn.disabled = true;
      }
    }

    function navigateRelativeNote(offset) {
      const idx = state.files.findIndex(f => f.path === state.activePath);
      const nextIdx = idx + offset;
      if (nextIdx >= 0 && nextIdx < state.files.length) {
        selectNote(state.files[nextIdx].path);
      }
    }

    // =========================================================================
    // 8. SIDEBAR, MODAL & UTILITIES
    // =========================================================================
    function toggleSidebar(forceState) {
      const sidebar = document.getElementById('left-sidebar');
      const backdrop = document.getElementById('mobile-backdrop');

      if (window.innerWidth < 1024) {
        const isOpen = !sidebar.classList.contains('-translate-x-full');
        const nextOpen = typeof forceState === 'boolean' ? forceState : !isOpen;
        sidebar.classList.toggle('-translate-x-full', !nextOpen);
        backdrop.classList.toggle('hidden', !nextOpen);
      } else {
        const nextVisible = typeof forceState === 'boolean' ? forceState : state.sidebarCollapsed;
        state.sidebarCollapsed = !nextVisible;
        sidebar.classList.toggle('hidden', state.sidebarCollapsed);
      }
    }

    function openSetupModal() {
      syncFormWithState();
      const modal = document.getElementById('setup-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeSetupModal() {
      const modal = document.getElementById('setup-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    async function saveAndConnectRepo(e) {
      e.preventDefault();
      state.config = {
        owner: document.getElementById('input-owner').value.trim() || 'mkharwar314',
        repo: document.getElementById('input-repo').value.trim(),
        branch: document.getElementById('input-branch').value.trim() || 'main',
        token: document.getElementById('input-token').value.trim()
      };
      saveConfigToStorage();
      closeSetupModal();
      await connectToGitHubRepo(state.config);
    }

    async function discoverUserRepos() {
      const owner = document.getElementById('input-owner').value.trim() || 'mkharwar314';
      const token = document.getElementById('input-token').value.trim();
      const pickerBox = document.getElementById('repo-picker-box');
      const pickerList = document.getElementById('repo-picker-list');

      pickerBox.classList.remove('hidden');
      pickerList.innerHTML = `<p class="text-muted px-1 py-1">Loading...</p>`;

      try {
        const headers = { 'Accept': 'application/vnd.github+json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const res = await fetch(`https://api.github.com/users/${encodeURIComponent(owner)}/repos?sort=updated&per_page=30`, { headers });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const repos = await res.json();
        if (!Array.isArray(repos) || repos.length === 0) {
          pickerList.innerHTML = `<p class="text-muted px-1 py-1">No public repositories found.</p>`;
          return;
        }

        pickerList.innerHTML = repos.map(r => `
          <button
            type="button"
            onclick="pickDiscoveredRepo('${escapeHtml(r.name)}', '${escapeHtml(r.default_branch || 'main')}')"
            class="w-full flex items-center justify-between px-2 py-1 rounded hover:bg-elevated text-left text-ink transition"
          >
            <span class="truncate">${escapeHtml(r.name)}</span>
            <span class="text-[11px] text-muted shrink-0 ml-2">${escapeHtml(r.default_branch || 'main')}</span>
          </button>
        `).join('');
      } catch (err) {
        pickerList.innerHTML = `<p class="text-muted px-1 py-1">Unable to list repositories (${escapeHtml(err.message)}).</p>`;
      }
    }

    function pickDiscoveredRepo(repoName, defaultBranch) {
      document.getElementById('input-repo').value = repoName;
      document.getElementById('input-branch').value = defaultBranch;
      document.getElementById('repo-picker-box').classList.add('hidden');
    }

    function setLoadingState(isLoading) {
      const loader = document.getElementById('reader-loader');
      const mdOut = document.getElementById('markdown-output');
      const rawOut = document.getElementById('raw-output-container');

      if (isLoading) {
        loader.classList.remove('hidden');
        mdOut.classList.add('hidden');
        rawOut.classList.add('hidden');
      } else {
        loader.classList.add('hidden');
        setViewMode(state.viewMode);
      }
    }

    function showBanner(message) {
      const banner = document.getElementById('status-banner');
      document.getElementById('status-banner-msg').textContent = message;
      banner.classList.remove('hidden');
    }

    function hideBanner() {
      document.getElementById('status-banner').classList.add('hidden');
    }

    function copyActiveNoteMarkdown() {
      if (!state.activePath || state.contentCache[state.activePath] === undefined) return;
      copyTextToClipboard(state.contentCache[state.activePath]);
      showToast('Markdown copied');
    }

    function copyTextToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
      } catch (err) {
        console.error('Copy failed:', err);
      }
      document.body.removeChild(textarea);
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = msg;
      toast.classList.remove('translate-y-16', 'opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('translate-y-16', 'opacity-0');
      }, 2000);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
